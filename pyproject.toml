[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopredict"
version = "0.1.0"
description = "Cryptocurrency price (log-return) forecasting with classical ML, walk-forward evaluation and backtesting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cryptopredict = "cryptopredict.cli:main"

[tool.setuptools.packages.find]
include = ["cryptopredict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
